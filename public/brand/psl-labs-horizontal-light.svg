    <text x="0" y="46" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#0f172a">PSL </tspan>
      <tspan fill="#0284c7">LABS</tspan>
    </text>
    
    <!-- Subtitle -->
