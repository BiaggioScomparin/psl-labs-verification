      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <!-- Icon on Left -->
  <g transform="translate(15, 10)">
    <path d="M70 12 L18 42 V72 C18 105 43 130 70 138 C97 130 122 105 122 72 V42 L70 12 Z" 
