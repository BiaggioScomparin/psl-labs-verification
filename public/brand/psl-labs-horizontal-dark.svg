    <g stroke="url(#cyanGradH)" stroke-width="6" stroke-linecap="round">
      <line x1="70" y1="31" x2="70" y2="114" />
      <line x1="37" y1="52" x2="103" y2="94" />
      <line x1="103" y1="52" x2="37" y2="94" />
    </g>
    <circle cx="70" cy="72" r="17" fill="#10b981" stroke="#ffffff" stroke-width="3.5" />
  </g>

  <!-- Typography -->
  <g transform="translate(175, 45)">
