<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer HexaShield -->
  <path d="M100 16 L25 58 V100 C25 146 60 181 100 192 C140 181 175 146 175 100 V58 L100 16 Z" 
        fill="url(#shieldGrad)" 
        stroke="#38bdf8" 
        stroke-width="7" 
        stroke-linejoin="round"/>
  <!-- Molecular / Crystalline Axes -->
  <g stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="100" y1="42" x2="100" y2="158" />
    <line x1="54" y1="71" x2="146" y2="129" />
    <line x1="146" y1="71" x2="54" y2="129" />
  </g>
  <!-- Emerald Biotech Nucleus -->
  <circle cx="100" cy="100" r="24" fill="#10b981" stroke="#ffffff" stroke-width="5" filter="url(#glow)" />
</svg>